name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# The build job makes the APK. The publish job makes the GitHub Release.
# Only the publish job can write to the repository, and it runs no build tools.
# Both jobs use only actions from GitHub.

# Set four repository secrets to sign with a stable key.
# KEYSTORE_BASE64 is the base64 text of the release keystore.
# KEYSTORE_PASSWORD is the password of the keystore.
# KEY_ALIAS is the alias of the key.
# KEY_PASSWORD is the password of the key.

# Without the secrets, the build job signs with a temporary debug key.
# Android refuses to update an app when the key changes.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: |
          node --test shelly/test/*.test.js
          ./gradlew testDebugUnitTest lintDebug

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION="${TAG#v}"
          else
            export VERSION="0.0.${VERSION_CODE}-dev"
          fi
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            export KEYSTORE_FILE="${RUNNER_TEMP}/release.jks"
          else
            echo "::warning::No release keystore. The APK has a temporary debug signature."
          fi
          ./gradlew assembleRelease
          rm -f "${RUNNER_TEMP}/release.jks"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/charge-limiter-${VERSION}.apk"
          cp shelly/charge-limiter.js dist/

      - uses: actions/upload-artifact@v4
        with:
          name: charge-limiter-release
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: charge-limiter-release
          path: dist

      # The job attaches the files to a draft release and publishes it as the last step.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --draft --generate-notes --title "${TAG}" dist/*
          gh release edit "${TAG}" --draft=false
