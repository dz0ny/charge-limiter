plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.chargelimit'
    compileSdk 36

    defaultConfig {
        applicationId 'app.chargelimit'
        minSdk 26
        targetSdk 36
        versionCode((System.getenv('VERSION_CODE') ?: '1') as Integer)
        versionName System.getenv('VERSION') ?: '0.1-dev'
    }

    def keystore = System.getenv('KEYSTORE_FILE')
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
